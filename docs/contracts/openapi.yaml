  /api/v1/namespaces/{namespace}/designs/{design}/uploads:
    post:
      tags:
      - designs
      summary: Create Artifact Uploads
      description: 'Hand out presigned PUT URLs so artifacts bypass the API on the
        way in.


        Cloud Run rejects requests over 32MiB at the frontend, well below the

        256MB an artifact may be, so the bytes cannot travel through this service

        Each URL is signed for exactly one content-addressed key *and*

        one SHA-256, so an upload can neither land elsewhere nor carry different

        content; the publish request then references the digest instead of

        resending it. Pull already works this way (307 to a presigned GET).'
      operationId: create_artifact_uploads_api_v1_namespaces__namespace__designs__design__uploads_post
      parameters:
      - name: namespace
        in: path
        required: true
        schema:
          type: string
          title: Namespace
      - name: design
        in: path
        required: true
        schema:
          type: string
          title: Design
      - name: authorization
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ArtifactUploadRequest'
      responses:
        '200':
          description: Successful Response
