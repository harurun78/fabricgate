openapi: 3.1.0
info:
  title: FabricGate Registry
  version: 0.1.0
paths:
  /api/v1/livez:
    get:
      tags:
      - health
      summary: Liveness
      description: 'Liveness probe: the process is up and serving.


        Intentionally checks no external dependencies — use this for the container

        HEALTHCHECK so a transient DB/S3 outage does not trigger a restart loop.

        See ``/health`` for the deep readiness check (DB + S3) used by LBs/monitors.'
      operationId: liveness_api_v1_livez_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LivenessResponse'
  /api/v1/health:
    get:
      tags:
      - health
      summary: Health Check
      description: 'Deep health check: verifies DB and S3/MinIO connectivity.


        Returns HTTP 503 with ``status: "degraded"`` if any component fails.

        Individual component statuses are in the ``database`` and ``storage`` fields.

        Error details are logged server-side only (not exposed in the response).'
      operationId: health_check_api_v1_health_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
  /api/v1/designs:
    get:
      tags:
      - designs
      summary: Search Designs
      operationId: search_designs_api_v1_designs_get
      parameters:
      - name: q
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Q
      - name: platform
        in: query
        required: false
        schema:
