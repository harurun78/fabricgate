  /api/v1/oauth/device/activate:
    get:
      tags:
      - auth
      summary: Device Activate
      description: 'Send the user from our /device page to the broker''s activation
        screen.


        The CLI prints ``{FG_FRONTEND_URL}/device``; that page collects the user

        code and lands here. Keeping the hop server-side means the broker''s

        hostname stays in ``AuthBrokerConfig`` with every other broker URL instead

        of being duplicated into the frontend''s build-time config, and Phase 2''s

        ZITADEL (which names this page differently) is absorbed there too.


        Not an open redirect: the destination host comes from configuration and

        only the query value is caller-supplied.'
      operationId: device_activate_api_v1_oauth_device_activate_get
      parameters:
      - name: user_code
        in: query
        required: true
        schema:
          type: string
          minLength: 1
          maxLength: 32
          pattern: ^[A-Za-z0-9-]+$
          title: User Code
      responses:
        '307':
          description: Successful Response
