          - type: 'null'
          title: Platform
      - name: board
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Board
      - name: device_family
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Device Family
      - name: runtime
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Runtime
      - name: tag
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Tag
      - name: namespace
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Namespace
      - name: page
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          default: 1
          title: Page
      - name: per_page
        in: query
        required: false
        schema:
          type: integer
          maximum: 100
          minimum: 1
          default: 20
          title: Per Page
      - name: sort
        in: query
        required: false
        schema:
          type: string
          default: updated
          title: Sort
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
