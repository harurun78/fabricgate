# FabricGate Official Board DB
# This file is bundled with the CLI and updated with each release.
# Do NOT edit manually. Use ~/.fabricgate/board-db/custom.yaml for overrides.
# Custom boards: see docs/specs/board-db-schema.md (schema) and CONTRIBUTING.md (how to add one).
version: fabricgate-boarddb/v1

boards:
  # -------------------------------------------------------------------------
  # Xilinx / AMD MPSoC (Zynq UltraScale+)
  # -------------------------------------------------------------------------
  - board_id: zcu104
    display_name: Xilinx ZCU104 Evaluation Board
    vendor: xilinx
    boardpart: "xilinx.com:zcu104:part0:1.1"
    device: xczu7ev-ffvc1156-2-e
    device_family: xczu7ev
    pynq_supported: true
    interfaces:
      - type: pmod
        count: 2
        source: vivado-boardstore
      - type: hdmi
        direction: tx
        count: 1
        source: vivado-boardstore
      - type: uart
        direction: inout
        count: 1
        source: vivado-boardstore

  - board_id: zcu102
    display_name: Xilinx ZCU102 Evaluation Board
    vendor: xilinx
    # Source: Xilinx Board Store boards/Xilinx/zcu102/3.4/board.xml (branch 2024.1)
    #   (vendor="xilinx.com" name="zcu102", part0 part_name="xczu9eg-ffvb1156-2-e")
    #   https://github.com/Xilinx/XilinxBoardStore/blob/2024.1/boards/Xilinx/zcu102/3.4/board.xml
    # 3.4 is the newest board file; public .hwh / project scripts also carry 2.0 / 3.0-3.3,
    # which the version-tolerant .hwh reverse lookup resolves here.
    boardpart: "xilinx.com:zcu102:part0:3.4"
    device: xczu9eg-ffvb1156-2-e
    device_family: xczu9eg
    pynq_supported: true
    interfaces:
      - type: uart
        direction: inout
        count: 1
        source: vivado-boardstore # uart2_pl
      - type: i2c
        direction: inout
        count: 2
        source: vivado-boardstore # iic0_pl / iic1_pl

  - board_id: zcu106
    display_name: Xilinx ZCU106 Evaluation Platform
    vendor: xilinx
    # Source: Xilinx Board Store boards/Xilinx/zcu106/2.6/board.xml (branch 2024.1)
    #   (vendor="xilinx.com" name="zcu106", part0 part_name="xczu7ev-ffvc1156-2-e")
    #   https://github.com/Xilinx/XilinxBoardStore/blob/2024.1/boards/Xilinx/zcu106/2.6/board.xml
    # 2.6 is the newest board file; 1.0 / 1.1 / 2.0-2.5 also circulate and resolve here
    # through the version-tolerant .hwh reverse lookup. Same device as ZCU104.
    boardpart: "xilinx.com:zcu106:part0:2.6"
    device: xczu7ev-ffvc1156-2-e
    device_family: xczu7ev
    pynq_supported: true
    interfaces:
      - type: uart
        direction: inout
        count: 1
        source: vivado-boardstore # uart2_pl
      - type: i2c
        direction: inout
        count: 2
        source: vivado-boardstore # iic0_pl / iic1_pl
      - type: sfp
        direction: inout
        count: 2
        source: vivado-boardstore # sfp_1x / sfp_2x (gt_rtl)

  - board_id: ultra96-v2
    display_name: Avnet Ultra96-V2
    vendor: avnet
    # Source: Avnet board file ultra96v2/1.2/board.xml as published in the Xilinx Board Store
    #   (vendor="avnet.com" name="Ultra96v2", part0 part_name="xczu3eg-sbva484-1-i";
    #   Vivado lower-cases the name in the BOARD_PART string)
    #   https://github.com/Xilinx/XilinxBoardStore/blob/2024.1/boards/Avnet/ultra96v2/1.2/board.xml
    # Other strings in circulation: avnet.com:ultra96v2:part0:1.1 (most public .hwh files;
    # resolves here via the version-tolerant lookup), em.avnet.com:ultra96v2:part0:1.0
    # (Avnet bdf 2017.4 branch) and the 1.3 file on Avnet bdf master, which renamed the
    # vendor to "Avnet-tria" (https://github.com/Avnet/bdf/blob/master/ultra96v2/1.3/board.xml).
    # The last two differ in vendor, and lookup_by_boardpart only tolerates the version, so
    # they stay unresolved even after the #14 parser fix until vendor aliases are supported.
    boardpart: "avnet.com:ultra96v2:part0:1.2"
    device: xczu3eg-sbva484-1-i
    device_family: xczu3eg
    pynq_supported: true
    interfaces: [] # board.xml declares no PL interfaces (ps8_fixedio only)

  - board_id: pynq-zu
    display_name: TUL PYNQ-ZU
    vendor: tul
    # Source: Xilinx Board Store boards/TUL/pynqzu/1.1/board.xml (branch 2024.1)
    #   (vendor="tul.com.tw" name="pynqzu", part0 part_name="xczu5eg-sfvc784-1-e")
    #   https://github.com/Xilinx/XilinxBoardStore/blob/2024.1/boards/TUL/pynqzu/1.1/board.xml
    # BOARD_PART / part confirmed in the PYNQ base overlay
    #   https://github.com/Xilinx/PYNQ-ZU/blob/master/Pynq-ZU/base/base.tcl
    boardpart: "tul.com.tw:pynqzu:part0:1.1"
    device: xczu5eg-sfvc784-1-e
    device_family: xczu5eg
    pynq_supported: true
    interfaces:
      - type: pmod
        count: 2
        source: vivado-boardstore # pmod0 / pmod1 (gpio_rtl)
      - type: grove
        count: 2
        source: vivado-boardstore # grove0 / grove1 (gpio_rtl)
      - type: audio
        direction: inout
        count: 1
        source: vivado-boardstore # audio_i2s

  # -------------------------------------------------------------------------
  # AMD Kria SOM (K26) — boardpart names the SOM; the carrier is a board connection
  # -------------------------------------------------------------------------
  - board_id: kv260
    display_name: AMD Kria KV260 Vision AI Starter Kit
    vendor: xilinx
    # Source: Xilinx Board Store boards/Xilinx/kv260_som/1.4/board.xml (branch 2024.1)
    #   (vendor="xilinx.com" name="kv260_som", part0 part_name="xck26-sfvc784-2LV-c")
    #   https://github.com/Xilinx/XilinxBoardStore/blob/2024.1/boards/Xilinx/kv260_som/1.4/board.xml
    # 1.4 is the newest board file; 1.2 / 1.3 also circulate and resolve here through the
    # version-tolerant .hwh reverse lookup.
    boardpart: "xilinx.com:kv260_som:part0:1.4"
    device: xck26-sfvc784-2LV-c
    device_family: xck26
    pynq_supported: true
    interfaces: [] # SOM board.xml declares no PL interfaces; they come from kv260_carrier

  - board_id: kr260
    display_name: AMD Kria KR260 Robotics Starter Kit
    vendor: xilinx
    # Source: Xilinx Board Store boards/Xilinx/kr260_som/1.1/board.xml (branch 2024.1)
    #   (vendor="xilinx.com" name="kr260_som", part0 part_name="xck26-sfvc784-2LV-c")
    #   https://github.com/Xilinx/XilinxBoardStore/blob/2024.1/boards/Xilinx/kr260_som/1.1/board.xml
    # 1.1 is the newest board file; 1.0 also circulates and resolves here through the
    # version-tolerant .hwh reverse lookup. Same device as KV260.
    boardpart: "xilinx.com:kr260_som:part0:1.1"
    device: xck26-sfvc784-2LV-c
    device_family: xck26
    pynq_supported: true
    interfaces: [] # SOM board.xml declares no PL interfaces; they come from kr260_carrier

  # -------------------------------------------------------------------------
  # Xilinx / AMD Zynq-7000
  # -------------------------------------------------------------------------
  - board_id: pynq-z2
    display_name: TUL PYNQ-Z2
    vendor: tul
    boardpart: "tul.com.tw:pynq-z2:part0:1.0"
    device: xc7z020clg400-1
    device_family: xc7z020
    pynq_supported: true
    interfaces:
      - type: pmod
        count: 2
        source: vivado-boardstore
      - type: hdmi
        direction: tx
        count: 1
        source: vivado-boardstore
      - type: audio
        direction: inout
        count: 1
        source: vivado-boardstore

  - board_id: pynq-z1
    display_name: Digilent PYNQ-Z1
    vendor: digilent
    # Source: Digilent board files pynq-z1/1.0/board.xml
    #   (vendor="www.digilentinc.com" name="PYNQ-Z1", part0 part_name="xc7z020clg400-1";
    #   Vivado normalizes the board name to lower case in the BOARD_PART string)
    #   https://github.com/cathalmccabe/pynq-z1_board_files/blob/master/pynq-z1/1.0/board.xml
    # Same device as PYNQ-Z2 but a different board part / pin-out; the PYNQ base
    # overlay is built with `-part xc7z020clg400-1` only
    #   https://github.com/Xilinx/PYNQ/blob/master/boards/Pynq-Z1/base/base.tcl
    boardpart: "www.digilentinc.com:pynq-z1:part0:1.0"
    device: xc7z020clg400-1
    device_family: xc7z020
    pynq_supported: true
    interfaces:
      - type: pmod
        count: 2
        source: manual # board.xml: ja / jb (digilentinc.com:interface:pmod_rtl)
      - type: i2c
        direction: inout
        count: 1
        source: manual # board.xml: i2c (xilinx.com:interface:iic_rtl)
      - type: spi
        direction: inout
        count: 1
        source: manual # board.xml: spi (xilinx.com:interface:spi_rtl)

  # -------------------------------------------------------------------------
  # Xilinx / AMD RFSoC (Zynq UltraScale+ RFSoC)
  # -------------------------------------------------------------------------
  - board_id: zcu111
    display_name: Xilinx ZCU111 RFSoC Evaluation Kit
    vendor: xilinx
    # Source: Xilinx Board Store boards/Xilinx/zcu111/1.4/board.xml (branch 2024.1)
    #   (vendor="xilinx.com" name="zcu111", part0 part_name="xczu28dr-ffvg1517-2-e")
    #   https://github.com/Xilinx/XilinxBoardStore/blob/2024.1/boards/Xilinx/zcu111/1.4/board.xml
    # 1.4 is the newest board file; PYNQ-era projects also use 1.1 / 1.2 (DSP-PYNQ pins 1.1).
    # The .hwh reverse lookup ignores the trailing board file version when there is no
    # exact match, so 1.1 / 1.2 / 1.3 HWH files resolve here too; pull resolves by board_id.
    boardpart: "xilinx.com:zcu111:part0:1.4"
    device: xczu28dr-ffvg1517-2-e
    device_family: xczu28dr
    pynq_supported: true
    interfaces:
      - type: uart
        direction: inout
        count: 1
        source: vivado-boardstore # uart2_pl
      - type: i2c
        direction: inout
        count: 2
        source: vivado-boardstore # iic0_pl / iic1_pl
      - type: sfp
        direction: inout
        count: 4
        source: vivado-boardstore # sfp0_1x .. sfp3_1x (gt_rtl)

  - board_id: rfsoc2x2
    display_name: Xilinx RFSoC 2x2 Development Board
    vendor: xilinx
    # Source: Xilinx board file rfsoc2x2/1.1/board.xml (distributed via the Vivado
    #   board store xhub, not on GitHub; copy at
    #   https://github.com/ali-rasteh/rfsoc-sdr/blob/main/vivado/rfsoc_board_files/rfsoc2x2/1.1/board.xml)
    #   (vendor="xilinx.com" name="rfsoc2x2", part0 part_name="xczu28dr-ffvg1517-2-e")
    # BOARD_PART string confirmed in the PYNQ team's DSP-PYNQ project script
    #   https://github.com/Xilinx/DSP-PYNQ/blob/master/boards/RFSoC2x2/create_project.tcl
    #   and the device in the PYNQ base overlay
    #   https://github.com/Xilinx/RFSoC2x2-PYNQ/blob/master/board/RFSoC2x2/base/base.tcl
    boardpart: "xilinx.com:rfsoc2x2:part0:1.1"
    device: xczu28dr-ffvg1517-2-e
    device_family: xczu28dr
    pynq_supported: true
    interfaces:
      - type: pmod
        count: 2
        source: manual # board.xml: pmod0 / pmod1 (gpio_rtl)

  - board_id: rfsoc4x2
    display_name: RealDigital RFSoC 4x2 Development Board
    vendor: realdigital
    # Source: RealDigital board files board_files/rfsoc4x2/1.0/board.xml
    #   (vendor="realdigital.org" name="rfsoc4x2", part0 part_name="xczu48dr-ffvg1517-2-e")
    #   https://github.com/RealDigitalOrg/RFSoC4x2-BSP/blob/master/board_files/rfsoc4x2/1.0/board.xml
    # BOARD_PART / part confirmed in the PYNQ base overlay
    #   https://github.com/Xilinx/RFSoC-PYNQ/blob/master/boards/RFSoC4x2/base/base.tcl
    boardpart: "realdigital.org:rfsoc4x2:part0:1.0"
    device: xczu48dr-ffvg1517-2-e
    device_family: xczu48dr
    pynq_supported: true
    interfaces:
      - type: pmod
        count: 3
        source: manual # board.xml: pmod0 / pmod1 / pmod01 (gpio_rtl)

  - board_id: zcu208
    display_name: Xilinx ZCU208 RFSoC Evaluation Kit
    vendor: xilinx
    # Source: Xilinx Board Store boards/Xilinx/zcu208/production/2.0/board.xml (branch 2024.1)
    #   (vendor="xilinx.com" name="zcu208", part0 part_name="xczu48dr-fsvg1517-2-e")
    #   https://github.com/Xilinx/XilinxBoardStore/blob/2024.1/boards/Xilinx/zcu208/production/2.0/board.xml
    # Same die as RFSoC 4x2 but a different package (fsvg1517, not ffvg1517).
    boardpart: "xilinx.com:zcu208:part0:2.0"
    device: xczu48dr-fsvg1517-2-e
    device_family: xczu48dr
    pynq_supported: true
    interfaces:
      - type: uart
        direction: inout
        count: 1
        source: vivado-boardstore # uart2_pl
      - type: i2c
        direction: inout
        count: 2
        source: vivado-boardstore # iic0_pl / iic1_pl
      - type: sfp
        direction: inout
        count: 2
        source: vivado-boardstore # sfp2_1x / sfp3_1x (gt_rtl); sfp0_1x / sfp1_1x are commented out in board.xml

  - board_id: zcu216
    display_name: Xilinx ZCU216 RFSoC Evaluation Kit
    vendor: xilinx
    # Source: Xilinx Board Store boards/Xilinx/zcu216/production/2.0/board.xml (branch 2024.1)
    #   (vendor="xilinx.com" name="zcu216", part0 part_name="xczu49dr-ffvf1760-2-e")
    #   https://github.com/Xilinx/XilinxBoardStore/blob/2024.1/boards/Xilinx/zcu216/production/2.0/board.xml
    # 2.0 is the newest board file; 1.0 (pre-production) also circulates and resolves here
    # through the version-tolerant .hwh reverse lookup.
    boardpart: "xilinx.com:zcu216:part0:2.0"
    device: xczu49dr-ffvf1760-2-e
    device_family: xczu49dr
    pynq_supported: true
    interfaces:
      - type: uart
        direction: inout
        count: 1
        source: vivado-boardstore # uart2_pl
      - type: i2c
        direction: inout
        count: 2
        source: vivado-boardstore # iic0_pl / iic1_pl
      - type: sfp
        direction: inout
        count: 2
        source: vivado-boardstore # sfp2_1x / sfp3_1x (gt_rtl); sfp0_1x / sfp1_1x are commented out in board.xml

  # -------------------------------------------------------------------------
  # Lattice iCE40 + RP2040
  # -------------------------------------------------------------------------
  - board_id: pico-ice
    display_name: pico-ice (iCE40UP5K + RP2040)
    vendor: tinyvision
    device_family: ice40up5k
    pynq_supported: false
    interfaces: []

  # -------------------------------------------------------------------------
  # Virtual boards — generated by fabricgate build, do not edit
  # -------------------------------------------------------------------------
  - board_id: generic-xczu7ev
    display_name: Generic xczu7ev (AXI-only)
    device_family: xczu7ev
    virtual: true
    category: generic
    interfaces: []

  - board_id: generic-xc7z020
    display_name: Generic xc7z020 (AXI-only)
    device_family: xc7z020
    virtual: true
    category: generic
    interfaces: []
