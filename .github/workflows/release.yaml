name: Release

# Triggers:
#   - push of a stable vX.Y.Z tag: full release (PyPI + attestation + GitHub Release)
#     Pre-release / staging tags (v0.1.0-staging.N) are handled by cd.yaml only;
#     they would always fail the version guard below, so Release ignores them.
#   - workflow_dispatch: TestPyPI dry-run (no GitHub Release)
#
# Prerequisites (one-time, human):
#   - PyPI / TestPyPI Trusted Publisher registered for this repo
#     (workflow=release.yaml, environment=pypi / testpypi)
#   - GitHub environments `pypi` and `testpypi` created
on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch: # TestPyPI dry-run

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  ci:
    name: CI Gate
    # ci.yaml declares `pull-requests: read`; a called workflow cannot request
    # more than the calling job holds, so grant it explicitly here. Without
    # this GitHub refuses to start the run at all (startup_failure, 0 jobs).
    permissions:
      contents: read
      pull-requests: read
    uses: ./.github/workflows/ci.yaml
    with:
      # In reusable workflows the `github` context is the caller's, so
      # ci.yaml's paths-filter sees an empty diff on tag pushes and would
      # skip every job. Force the full gate instead.
      force_all: true
    secrets: inherit

  build:
    name: Build public package
    runs-on: ubuntu-latest
    needs: [ci]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0

      - name: Verify tag matches package version
        if: github.event_name == 'push'
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PKG_VERSION=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::tag v$TAG_VERSION != pyproject.toml version $PKG_VERSION"
            exit 1
          fi

      - name: Use a unique dev version for TestPyPI dry-runs
        # TestPyPI never lets a deleted filename be reused, so every dry-run
        # publishes <version>.dev<run_number>. Tag pushes keep the real version.
        if: github.event_name == 'workflow_dispatch'
        run: |
          set -euo pipefail
          BASE=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          DEV="${BASE}.dev${GITHUB_RUN_NUMBER}"
          uv version --frozen "$DEV"
          sed -i "s/^__version__ = \".*\"$/__version__ = \"${DEV}\"/" src/fabricgate/_version.py
          grep -q "\"${DEV}\"" src/fabricgate/_version.py
          echo "dry-run version: ${DEV}"

      - name: Build
        run: uv build

      - name: Enforce publication boundary (no registry code in wheel/sdist)
        # Capture listings before grepping so a failed listing (missing
        # artifact, unreadable archive) fails the step instead of being
        # swallowed by the pipe inside the `if` condition.
        run: |
          set -euo pipefail
          shopt -s nullglob
          wheels=(dist/*.whl)
          sdists=(dist/*.tar.gz)
          if [ "${#wheels[@]}" -eq 0 ] || [ "${#sdists[@]}" -eq 0 ]; then
            echo "::error::expected at least one wheel and one sdist in dist/ (found ${#wheels[@]} wheel(s), ${#sdists[@]} sdist(s))"
            exit 1
          fi
          for whl in "${wheels[@]}"; do
            listing=$(python3 -m zipfile --list "$whl")
            if grep -q "fabricgate/registry/" <<<"$listing"; then
              echo "::error::wheel $whl contains fabricgate/registry/ — distribution-policy P-2 violation"
              exit 1
            fi
          done
          for sdist in "${sdists[@]}"; do
            listing=$(tar -tzf "$sdist")
            if grep -q "fabricgate/registry/" <<<"$listing"; then
              echo "::error::sdist $sdist contains fabricgate/registry/ — distribution-policy P-2 violation"
              exit 1
            fi
          done

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: dist
          path: dist/

  publish:
    name: Publish to ${{ github.event_name == 'workflow_dispatch' && 'TestPyPI' || 'PyPI' }}
    runs-on: ubuntu-latest
    needs: [build]
    environment: ${{ github.event_name == 'workflow_dispatch' && 'testpypi' || 'pypi' }}
    permissions:
      id-token: write # OIDC trusted publishing
      attestations: write
      contents: read
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/

      - name: Attest build provenance
        # GitHub does not store attestations for user-owned *private* repos
        # ("Feature not available for user-owned private repositories").
        # Tolerate that on TestPyPI dry-runs so the publish path can still be
        # rehearsed before the repo goes public; a real release (tag push)
        # must ship provenance and therefore still fails loudly here.
        continue-on-error: ${{ github.event_name == 'workflow_dispatch' }}
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: "dist/*"

      - name: Publish
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          repository-url: ${{ github.event_name == 'workflow_dispatch' && 'https://test.pypi.org/legacy/' || 'https://upload.pypi.org/legacy/' }}
          # TestPyPI rejects re-uploads of the same version; tolerate them
          # on dry-runs only so repeated dispatches don't fail. Real PyPI
          # releases (tag push) must still fail loudly on a duplicate.
          skip-existing: ${{ github.event_name == 'workflow_dispatch' }}

  release:
    name: GitHub Release
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    needs: [publish]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --generate-notes dist/*
